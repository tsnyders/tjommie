[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3.34"
protocol = { version = "0.5.0", path = "../protocol" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "sync", "time"] }
# native-tls like the daemon's, so the relay's wss:// (T1.3) builds from the same artifacts.
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

[dev-dependencies]
daemon = { path = "../daemon" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
