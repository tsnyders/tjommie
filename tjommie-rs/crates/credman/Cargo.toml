[package]
name = "credman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The lock's warnings reach the desktop's log file through `log`; the daemon has no logger, so they go to stderr too.
log = "0.4.35"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }

[lints]
workspace = true
