[package]
name = "desktop-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jiff = "0.2.41"
log = { version = "0.4.35", features = ["std"] }
# owner_safety::test_root: a disposable folder under %TEMP% for tests.
tempfile = "3.27.0"
# GPUI already builds windows with WindowsAndMessaging, LibraryLoader and Gdi (shell::animation's hidden window), so the
# workspace's windows feature set, and GPUI's build, stay the same.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Recovery",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
