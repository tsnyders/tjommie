[package]
name = "desktop-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
client = { path = "../client" }
futures-util = "0.3.34"
getrandom = "0.4.3"
jiff = "0.2.41"
log = { version = "0.4.35", features = ["std"] }
protocol = { path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio ={ version = "1.54.1", features = ["rt", "macros", "process", "io-util", "net", "sync", "time"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Recovery"] }
zeroize = "1.8"

[dev-dependencies]
daemon = { path = "../daemon" }
tempfile = "3.27.0"
tokio-tungstenite = "0.29"
# crash::tests reads the restart registration back.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
