[package]
name = "desktop-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-channel = "2.5.0"
futures = "0.3.34"
jiff = "0.2.41"
log = { version = "0.4.35", features = ["std"] }
protocol = { version = "0.5.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
# owner_safety::test_root: a disposable folder under %TEMP% for tests.
tempfile = "3.27.0"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
webview2-com.workspace = true
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Recovery",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
