[package]
name = "daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jiff = "0.2.41"
protocol = { version = "0.4.2", path = "../protocol" }
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "rt", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "test-util"] }
