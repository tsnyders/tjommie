[package]
name = "daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
protocol = { version = "0.4.2", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-util = "0.7.20"
tungstenite = { version = "0.29", default-features = false }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["process", "io-util"] }
tokio-tungstenite = "0.29"

[[bin]]
name = "tjommie-daemon"
path = "src/main.rs"
