[package]
name = "daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
protocol = { version = "0.4.2", path = "../protocol" }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-util = "0.7.20"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "io-util"] }
tokio-tungstenite = "0.29"
uuid = { version = "1.26.0", features = ["v4"] }
# Tests spell roots with 8.3 short names.
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }

[[bin]]
name = "tjommie-daemon"
path = "src/main.rs"
