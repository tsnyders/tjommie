[package]
name = "daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
ed25519-dalek = "2.2"
futures-util = "0.3.34"
getrandom = "0.4.3"
jiff = "0.2.41"
jsonschema = { version = "0.61.0", default-features = false }
protocol = { version = "0.4.2", path = "../protocol" }
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.10.7"
sha2 = "0.10.9"
socket2 = "0.6.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tokio-util = "0.7.20"
transport = { version = "0.4.2", path = "../transport" }
tungstenite = { version = "0.29", default-features = false }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
windows = { version = "0.62.2", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Networking_WinSock",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
zeroize = { version = "1.8", features = ["serde"] }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["process", "io-util", "macros", "test-util"] }
tokio-tungstenite = "0.29"
# Tests spell roots with 8.3 short names.
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }

[[bin]]
name = "tjommie-daemon"
path = "src/main.rs"
