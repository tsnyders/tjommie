[package]
name = "desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The e2e test driver: a named pipe the e2e tests drive the app through. Never in a release build (tests/pins.rs).
test-driver = []

[dependencies]
base64 = "0.23.1"
client = { path = "../client" }
desktop-host = { path = "../desktop-host" }
futures = "0.3.34"
gpui.workspace = true
gpui-kit.workspace = true
jiff = "0.2.41"
log = "0.4.35"
# Chat Markdown is rewritten before gpui-kit's TextView draws it (ui::files::markdown): the same parser it uses.
markdown = "1.0.0"
protocol = { path = "../protocol" }
regex = "1.13.1"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
url = "2.5.8"
# Always on, though only the test driver uses it: a feature that changed these would rebuild GPUI.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
# View tests: GPUI's TestAppContext.
gpui = { workspace = true, features = ["test-support"] }

[[bin]]
name = "tjommie-desktop"
path = "src/main.rs"

[lints]
workspace = true
