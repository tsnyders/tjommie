# No console windows: processes are created only by daemon::spawn::command(), which sets CREATE_NO_WINDOW.
# allow-invalid: the paths don't exist for every target (tokio isn't in every crate; std::os::windows isn't on Android).
disallowed-methods = [
  { path = "std::process::Command::new", reason = "use spawn::command() so the child gets CREATE_NO_WINDOW" },
  { path = "tokio::process::Command::new", reason = "use spawn::command() so the child gets CREATE_NO_WINDOW", allow-invalid = true },
  { path = "std::os::windows::process::CommandExt::creation_flags", reason = "use NoWindowCommand::creation_flags, which keeps CREATE_NO_WINDOW", allow-invalid = true },
]
# The desktop crates deny these (Cargo.toml [workspace.lints.clippy]); tests may still use them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
