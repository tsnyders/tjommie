name: R1 acceptance (Rust daemon over a 0.4.2 install)

# Release R1 swaps the Node daemon for the Rust one inside the same Electron app (spec §5, plan M9 T9.2). This run proves it
# on a disposable runner that has never seen Tjommie, so it may install the production identity and use its data root:
#
#   1. Install 0.4.2 from GitHub Releases.
#   2. Seed its data root (accounts, bots with folders, chats, usage).
#   3. Install R1 over it.
#   4. R1's file list equals a fresh build's; its daemon backs the database up before opening it and keeps every row.
#   5. Reinstall 0.4.2 over R1 (the rollback): its file count returns to what it was, and its own daemon opens the database.
#   6. The black-box real tests pass against the packaged test identity.
#
# Nothing here ever runs on the owner's PC: scripts/r1-acceptance.ts refuses to run outside GitHub Actions.

on:
  push:
    branches: ['r1-acceptance-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The release R1 upgrades from and rolls back to.
  PRODUCTION_VERSION: '0.4.2'
  # Hosted service logons can't reliably reach Credential Manager.
  TJOMMIE_CI_HOSTED: '1'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Inside tjommie-rs so rustup applies rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: tjommie-rs
        run: rustup toolchain install
      - name: Build the Rust daemon
        working-directory: tjommie-rs
        run: cargo build --release --locked -p daemon --bin tjommie-daemon
      - name: Build and verify pinned local speech runtime
        shell: pwsh
        run: ./packages/desktop/scripts/build-speech-runtime.ps1

      - name: Package R1 with the production identity
        run: npm run package
      - name: Verify the packaged R1
        run: npm run test:packaged

      - name: Check that this runner has no Tjommie data, and note where things go
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Tjommie'
          if (Test-Path -LiteralPath $root) { throw "The data root already exists on this runner: $root" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = (Resolve-Path -LiteralPath "dist-desktop/installer/Tjommie-Setup-$version.exe").Path
          $unpacked = (Resolve-Path -LiteralPath 'dist-desktop/installer/win-unpacked').Path
          @(
            "R1_ROOT=$root",
            "R1_COUNTS=$(Join-Path $env:RUNNER_TEMP 'r1-counts.json')",
            "R1_VERSION=$version",
            "R1_NEW_INSTALLER=$installer",
            "R1_UNPACKED=$unpacked"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download 0.4.2 from GitHub Releases and check it against its release metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tjommie-old'
          New-Item -ItemType Directory -Path $dir | Out-Null
          $name = "Tjommie-Setup-$env:PRODUCTION_VERSION.exe"
          gh release download "v$env:PRODUCTION_VERSION" --dir $dir --pattern $name --pattern latest.yml
          if ($LASTEXITCODE -ne 0) { throw "Could not download release v$env:PRODUCTION_VERSION." }
          $installer = Join-Path $dir $name
          $lines = Get-Content -LiteralPath (Join-Path $dir 'latest.yml')
          if ($lines -notcontains "version: $env:PRODUCTION_VERSION" -or $lines -notcontains "path: $name") {
            throw 'latest.yml does not name the 0.4.2 installer.'
          }
          $sha512 = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash -LiteralPath $installer -Algorithm SHA512).Hash))
          if (@($lines | Where-Object { $_.Trim() -eq "sha512: $sha512" }).Count -eq 0) {
            throw 'latest.yml SHA-512 does not match the downloaded installer.'
          }
          "R1_OLD_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 1. Install 0.4.2
        shell: pwsh
        run: |
          $r1 = @('--disable-warning=ExperimentalWarning', 'scripts/r1-acceptance.ts')
          $dir = node @r1 install --installer $env:R1_OLD_INSTALLER | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or -not $dir) { throw 'Installing 0.4.2 failed.' }
          $files = node @r1 files --dir $dir --installed | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or -not $files) { throw 'Counting the 0.4.2 install failed.' }
          "R1_INSTALL_DIR=$dir", "R1_FILES_OLD=$files" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "0.4.2 is installed in $dir with $files files."

      - name: 2. Seed the 0.4.2 data root
        shell: pwsh
        run: |
          $r1 = @('--disable-warning=ExperimentalWarning', 'scripts/r1-acceptance.ts')
          node @r1 seed --root $env:R1_ROOT --counts $env:R1_COUNTS
          if ($LASTEXITCODE -ne 0) { throw 'Seeding the data root failed.' }

      - name: 3. Install R1 over 0.4.2
        shell: pwsh
        run: |
          $r1 = @('--disable-warning=ExperimentalWarning', 'scripts/r1-acceptance.ts')
          $dir = node @r1 install --installer $env:R1_NEW_INSTALLER | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or -not $dir) { throw 'Installing R1 failed.' }
          if ($dir -ne $env:R1_INSTALL_DIR) { throw "R1 went to $dir, not over 0.4.2 in $env:R1_INSTALL_DIR." }

      - name: 4. R1 matches a fresh build, backs up the database and keeps every row
        shell: pwsh
        run: |
          $r1 = @('--disable-warning=ExperimentalWarning', 'scripts/r1-acceptance.ts')
          # The file list first: no daemon has run in the install folder yet.
          node @r1 files --dir $env:R1_INSTALL_DIR --installed --same-as $env:R1_UNPACKED
          if ($LASTEXITCODE -ne 0) { throw 'The installed R1 files differ from a fresh build.' }
          # R1's own daemon opens the data root 0.4.2 seeded, then stops as the app stops it.
          node @r1 start --install $env:R1_INSTALL_DIR --root $env:R1_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'The R1 daemon did not start on the 0.4.2 data root.' }
          node @r1 verify --root $env:R1_ROOT --counts $env:R1_COUNTS --stage upgraded --version $env:R1_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'The data root did not survive the first R1 start.' }

      - name: 5. Roll back to 0.4.2 and check that it still opens the database
        shell: pwsh
        run: |
          $r1 = @('--disable-warning=ExperimentalWarning', 'scripts/r1-acceptance.ts')
          $dir = node @r1 install --installer $env:R1_OLD_INSTALLER | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or -not $dir) { throw 'Reinstalling 0.4.2 failed.' }
          if ($dir -ne $env:R1_INSTALL_DIR) { throw "0.4.2 went to $dir, not over R1 in $env:R1_INSTALL_DIR." }
          node @r1 files --dir $dir --installed --equals $env:R1_FILES_OLD
          if ($LASTEXITCODE -ne 0) { throw 'The rolled-back install does not have the files 0.4.2 had before R1.' }
          # 0.4.2's own daemon opens the database R1 touched.
          node @r1 start --install $dir --root $env:R1_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'The 0.4.2 daemon did not start on the data root R1 used.' }
          node @r1 verify --root $env:R1_ROOT --counts $env:R1_COUNTS --stage rolledback
          if ($LASTEXITCODE -ne 0) { throw 'The data root did not survive the rollback.' }

      - name: 6a. Package the isolated test identity
        shell: pwsh
        run: |
          $testRoot = node --input-type=module -e 'import {mkdtempSync} from "node:fs"; import {tmpdir} from "node:os"; import {join} from "node:path"; console.log(mkdtempSync(join(tmpdir(),"tjommie-r1-")));'
          if ($LASTEXITCODE -ne 0) { throw 'Could not allocate the test root.' }
          $env:TJOMMIE_PACKAGE_TEST_ROOT = $testRoot
          $env:TJOMMIE_PACKAGE_APP_ID = 'com.tsnyders.tjommie.updatetest'
          $env:TJOMMIE_PACKAGE_PRODUCT = 'Tjommie Update Test'
          npm run package
          if ($LASTEXITCODE -ne 0) { throw 'Isolated desktop packaging failed.' }
          $exe = Join-Path $testRoot 'dist-desktop/installer/win-unpacked/Tjommie Update Test.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing test application.' }
          if (-not (Test-Path -LiteralPath (Join-Path (Split-Path $exe) 'resources/daemon/tjommie-daemon.exe') -PathType Leaf)) { throw 'The test application has no Rust daemon.' }
          "R1_TEST_EXECUTABLE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # test-map.md section 2: the black-box real tests that start the app's daemon. screens.real needs real accounts and
      # paid turns, and native-browser.real, remote-bridge.real and the others never start a daemon.
      - name: 6b. Run the black-box real tests against the packaged test identity
        shell: pwsh
        env:
          TJOMMIE_TEST_EXECUTABLE: ${{ env.R1_TEST_EXECUTABLE }}
          TJOMMIE_DAEMON_EXE: ${{ github.workspace }}\tjommie-rs\target\release\tjommie-daemon.exe
        run: |
          # desktop.real reads the real accounts folder under %LOCALAPPDATA%\Tjommie, the root steps 1-5 seeded. Point
          # LOCALAPPDATA somewhere empty so no test sees it.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'r1-real-tests'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          npx vitest run --mode real packages/desktop/src/desktop.real.test.ts packages/desktop/src/embedded-browser.real.test.ts packages/desktop/src/mobile-appearance.real.test.ts packages/desktop/src/mobile-motion.real.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'A black-box real test failed against the packaged test identity.' }
          # daemon-process.test.ts is a fast test (not a *.real.test.ts) that hosts the exe when TJOMMIE_DAEMON_EXE names it.
          npx vitest run packages/desktop/src/daemon-process.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'The daemon-process test failed against the Rust exe.' }
