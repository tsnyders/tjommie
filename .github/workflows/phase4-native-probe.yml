name: Phase 4 native runtime probe

on:
  push:
    branches: ['phase4-native-probe-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speech:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compile and verify pinned CPU speech runtime
        shell: pwsh
        run: ./packages/desktop/scripts/build-speech-runtime.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase4-speech-runtime
          path: .cache/speech-runtime/*
          if-no-files-found: error
          retention-days: 7
