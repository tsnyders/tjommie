name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/protocol-manifest.ts --check
      - run: node scripts/browser-tools-manifest.ts --check
      - run: node scripts/aegis-theme.ts --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TJOMMIE_CI_HOSTED: '1'
      - name: Build and verify pinned local speech runtime
        shell: pwsh
        run: ./packages/desktop/scripts/build-speech-runtime.ps1

  rust:
    runs-on: windows-latest
    # The desktop crates build GPUI (Phase 3), which more than doubles a cold build.
    timeout-minutes: 90
    defaults:
      run:
        # Inside tjommie-rs so rustup applies rust-toolchain.toml.
        working-directory: tjommie-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node is needed at test time: the M7 interop tests drive the TypeScript client (packages/client) through
      # tjommie-rs/tools/remote-probe.ts, and the worker and CLI tests run node.exe.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        working-directory: .
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The UI boundary rule (Phase 3 plan T0.4, M0 review F5): every handler registration in the desktop crate runs its
      # whole closure inside guarded(.
      - run: ./tools/check-guarded.ps1 -SelfTest
      - run: ./tools/check-guarded.ps1
      # --no-fail-fast: one run shows every failing test binary, not only the first one cargo stops at.
      - run: cargo test --workspace --locked --no-fail-fast
        env:
          # Hosted service logons can't reliably reach Credential Manager; those tests run on real PCs.
          TJOMMIE_CI_HOSTED: '1'
      # Spec §3.10: only the production build carries the update feed (Phase 3 plan T0.6). --workspace reuses the test
      # build's dependencies instead of compiling GPUI again.
      - name: The dev and e2e desktop builds have no update feed
        run: |
          function Assert-NoFeed {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('target\debug\tjommie-desktop.exe'))
            if ($text.Contains('github.com/tsnyders/tjommie')) { throw "The $env:TJOMMIE_IDENTITY desktop build contains the update feed." }
          }
          $env:TJOMMIE_IDENTITY = 'dev'
          cargo build --workspace --locked
          Assert-NoFeed
          $env:TJOMMIE_IDENTITY = 'e2e'
          cargo build --workspace --locked --features desktop/test-driver
          Assert-NoFeed
      # The e2e tests drive that e2e build through its test driver, each on a temp root (Phase 3 plan T0.5).
      - name: Desktop e2e tests
        run: cargo test --workspace --locked --features desktop/test-driver --test 'e2e_*'
        env:
          TJOMMIE_IDENTITY: e2e
      # The desktop's daemon-process test hosts the Rust exe when TJOMMIE_DAEMON_EXE names it (plan T9.1). Build it here so
      # that test runs on every change instead of being skipped. It needs the node_modules the step above installed.
      - run: cargo build --locked -p daemon --bin tjommie-daemon
      - name: Run the desktop daemon-process test against the Rust exe
        working-directory: .
        run: npx vitest run packages/desktop/src/daemon-process.test.ts
        env:
          TJOMMIE_DAEMON_EXE: ${{ github.workspace }}\tjommie-rs\target\debug\tjommie-daemon.exe
          TJOMMIE_CI_HOSTED: '1'
