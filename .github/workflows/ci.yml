name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/protocol-manifest.ts --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TJOMMIE_CI_HOSTED: '1'
      - name: Build and verify pinned local speech runtime
        shell: pwsh
        run: ./packages/desktop/scripts/build-speech-runtime.ps1

  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        # Inside tjommie-rs so rustup applies rust-toolchain.toml.
        working-directory: tjommie-rs
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # Hosted service logons can't reliably reach Credential Manager; those tests run on real PCs.
          TJOMMIE_CI_HOSTED: '1'
