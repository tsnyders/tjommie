name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/protocol-manifest.ts --check
      - run: node scripts/browser-tools-manifest.ts --check
      - run: node scripts/aegis-theme.ts --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TJOMMIE_CI_HOSTED: '1'
      - name: Build and verify pinned local speech runtime
        shell: pwsh
        run: ./packages/desktop/scripts/build-speech-runtime.ps1

  rust:
    runs-on: windows-latest
    # The desktop crates build GPUI (Phase 3), which more than doubles a cold build.
    timeout-minutes: 90
    defaults:
      run:
        # Inside tjommie-rs so rustup applies rust-toolchain.toml.
        working-directory: tjommie-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node is needed at test time: the M7 interop tests drive the TypeScript client (packages/client) through
      # tjommie-rs/tools/remote-probe.ts, and the worker and CLI tests run node.exe.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        working-directory: .
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The daemon's provider-fixtures switch (a feature for tests only; replays recorded conversations in place of a real
      # Claude or Codex) is off in every other step, and every test that proves it is gated on the feature, so those steps
      # lint and run none of it. This one lints it. It is a separate step on purpose: the default build stays feature-off.
      - run: cargo clippy -p daemon --all-targets --features provider-fixtures --locked -- -D warnings
      # The UI boundary rule (Phase 3 plan T0.4, M0 review F5): every handler registration in the desktop crate runs its
      # whole closure inside guarded(.
      - run: ./tools/check-guarded.ps1 -SelfTest
      - run: ./tools/check-guarded.ps1
      # The motion checks' frame statistics (Phase 3 plan T7.2): percentiles, the window filters and the 1 % lost-presents
      # rule, on the script's own samples (no PresentMon). -I: the interpreter ignores the working folder and PYTHON*.
      - run: python -I tools/perf/frame-stats.py --self-test
      # The pinned pdfium.dll (Phase 3 plan T4.4): the archive and the DLL are each checked by SHA-256. The PDF tests
      # (pdf::range_reads_only) and the e2e app's PDF viewer find it through TJOMMIE_PDFIUM_DLL; on CI the tests fail
      # without it rather than skip.
      - name: Fetch the pinned pdfium.dll
        run: |
          $dll = ./tools/fetch-pdfium.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'pdfium\pdfium.dll')
          "TJOMMIE_PDFIUM_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # --no-fail-fast: one run shows every failing test binary, not only the first one cargo stops at.
      - run: cargo test --workspace --locked --no-fail-fast
        env:
          # Hosted service logons can't reliably reach Credential Manager; those tests run on real PCs.
          TJOMMIE_CI_HOSTED: '1'
      # Spec §3.10: only the production build carries the update feed (Phase 3 plan T0.6). `cargo test --no-run` builds
      # the app with the test run's dependency features (GPUI's test-support), so GPUI isn't compiled a second time.
      - name: The dev and e2e desktop builds have no update feed
        run: |
          function Assert-NoFeed {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('target\debug\tjommie-desktop.exe'))
            # The feed's path, not the project's address: About links to the project in every build.
            if ($text.Contains('tsnyders/tjommie/releases/latest/download')) { throw "The $env:TJOMMIE_IDENTITY desktop build contains the update feed." }
          }
          $env:TJOMMIE_IDENTITY = 'dev'
          cargo test --workspace --locked --no-run
          Assert-NoFeed
          $env:TJOMMIE_IDENTITY = 'e2e'
          cargo test --workspace --locked --no-run --features desktop/test-driver
          Assert-NoFeed
      # The e2e tests start the daemon beside the app with TJOMMIE_PROVIDER_FIXTURES set (recorded turns, no real
      # provider), and a daemon built without the provider-fixtures feature refuses to start with that variable set, so
      # build it with the feature first. The feature-off build below replaces it before the daemon-process test.
      - run: cargo build -p daemon --bin tjommie-daemon --features provider-fixtures --locked
      # The e2e tests drive that e2e build through its test driver, each on a temp root (Phase 3 plan T0.5). Every e2e
      # binary runs and reports, whichever fails first.
      - name: Desktop e2e tests
        run: cargo test --workspace --locked --features desktop/test-driver --test 'e2e_*' --no-fail-fast
        env:
          TJOMMIE_IDENTITY: e2e
      # The desktop's daemon-process test hosts the Rust exe when TJOMMIE_DAEMON_EXE names it (plan T9.1). Build it here so
      # that test runs on every change instead of being skipped. It needs the node_modules the step above installed.
      - run: cargo build --locked -p daemon --bin tjommie-daemon
      - name: Run the desktop daemon-process test against the Rust exe
        working-directory: .
        run: npx vitest run packages/desktop/src/daemon-process.test.ts
        env:
          TJOMMIE_DAEMON_EXE: ${{ github.workspace }}\tjommie-rs\target\debug\tjommie-daemon.exe
          TJOMMIE_CI_HOSTED: '1'
      # The provider-fixtures switch's own tests: the replay, the review refusal, the startup wiring check, the end-to-end
      # daemon and the compile-fail guards. Separate from the workspace run, which is feature-off. It comes last on purpose:
      # building these tests also builds target\debug\tjommie-daemon.exe WITH the feature, and the desktop daemon-process
      # test above must run the feature-off exe. The compile-fail guards run a nested `cargo build` and `cargo rustc` on the
      # daemon crate from its own folder (the same workspace target folder), which adds about a minute and makes the
      # daemon rebuild once. The env is the workspace test step's.
      - run: cargo test -p daemon --features provider-fixtures --locked --no-fail-fast
        env:
          TJOMMIE_CI_HOSTED: '1'
